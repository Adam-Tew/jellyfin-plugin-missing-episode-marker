changelog: >
  Fix: a season without a poster of its own showed the show cover's marker, even when
  the season was complete. Such seasons now get a season poster fetched (poster repair),
  or else an unmarked copy of the show poster, which is removed again with the markers.
  Poster repair now also covers seasons.
