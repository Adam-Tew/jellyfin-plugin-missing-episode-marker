changelog: >
  Sonarr decides what counts: unmonitored shows and episodes are ignored (specials rules
  and the TV shows tab are removed). New markers for stalled downloads (yellow),
  downloading (purple) and new episodes on the way (blue), each with its own colours and
  text; seasons and covers show the most important one. Checks every few minutes
  (configurable) and instantly via a Sonarr webhook; see the README for setup.
  Banner colours and texts moved to the Markers tab, please check them after updating.
