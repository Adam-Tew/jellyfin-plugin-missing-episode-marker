targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Marks TV shows and seasons that are missing episodes, using Sonarr."
description: >
  Checks every series Sonarr manages for monitored episodes without a file and
  burns a configurable "missing episodes" banner into the series and season
  posters, so every client (including Swiftfin, Infuse and TV apps) shows it.
  Supports a grace period for ongoing shows, special-episode rules,
  per-series overrides and anime filler handling.
category: "General"
image: "image.png"
imageUrl: "https://raw.githubusercontent.com/Adam-Tew/jellyfin-plugin-missing-episode-marker/main/image.png"
owner: "Adam-Tew"
artifacts:
  - "Jellyfin.Plugin.MissingEpisodeMarker.dll"
changelog: >
  Markers come back within seconds when Jellyfin replaces a poster, and a series is
  rechecked as soon as episodes are added or removed. Settings page reorganized into
  tabs with search, multi-select rules, a specials picker and help texts. Grace period
  in days/weeks/months/years, schedule setting, progress bar with time estimate,
  optional menu entry, poster status in the report, and a plugin image.
