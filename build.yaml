framework: "net10.0"
overview: "Shows on show and season posters what Sonarr is doing: missing, stalled, downloading or on the way."
description: >
  Asks Sonarr for missing episodes and its download queue and burns a marker into
  show and season posters, so every client (including Swiftfin, Infuse and TV apps)
  shows it: red for missing episodes, yellow for a stalled download, purple for
  downloading and blue for a new episode on the way. Unmonitored shows and episodes
  are ignored. Checks every few minutes, or instantly via a Sonarr webhook.
  Supports a grace period, anime filler handling and poster repair.
category: "General"
