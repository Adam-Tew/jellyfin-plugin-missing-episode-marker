name: Release

# Publish a GitHub release with a tag like v0.1.0.0 to build the plugin,
# attach the zip to that release and add the new version to manifest.json
# (the plugin repository Jellyfin reads).

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jprm
        run: pip install jprm

      - name: Work out version
        id: v
        run: |
          # Accept v0.1.0.0, v.0.1.0.0 and 0.1.0.0.
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#.}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3.4 (four numbers)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: |
          mkdir -p artifacts
          jprm --verbosity=debug plugin build . --output=artifacts --version=${{ steps.v.outputs.version }} --dotnet-framework=net10.0
          ls -la artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/missing-episode-marker_${{ steps.v.outputs.version }}.zip
          generate_release_notes: true

      - name: Update manifest.json on main
        run: |
          ZIP="missing-episode-marker_${{ steps.v.outputs.version }}.zip"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}"
          cp "artifacts/${ZIP}" /tmp/"${ZIP}"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          jprm repo add --plugin-url "${URL}" ./manifest.json /tmp/"${ZIP}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add version ${{ steps.v.outputs.version }} to manifest"
          git push origin main
