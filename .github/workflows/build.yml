name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'manifest.json']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Jellyfin.Plugin.MissingEpisodeMarker.sln --configuration Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.MissingEpisodeMarker
          path: Jellyfin.Plugin.MissingEpisodeMarker/bin/Release/net10.0/Jellyfin.Plugin.MissingEpisodeMarker.dll
